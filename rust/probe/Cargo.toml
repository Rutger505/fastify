[package]
name = "fastify-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side test harness: runs the same core library calls as the app against a real account.

[dependencies]
fastify-core = { path = "../core" }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
env_logger = "0.11"
