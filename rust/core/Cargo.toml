[package]
name = "fastify-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "fastify_core"

[dependencies]
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-audio = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
uniffi = "0.32.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
hex = "0.4"
http = "1"
librespot-protocol = "0.8.0"
protobuf = "3.7"
bytes = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
